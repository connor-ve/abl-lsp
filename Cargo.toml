[workspace]
members = ["crates/core", "crates/oe", "crates/lsp", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2021"
rust-version = "1.89"
authors = ["Connor Van Etten"]
repository = "https://github.com/connor-ve/abl-lsp"
license = "MIT"

[workspace.dependencies]
abl-core = { path = "crates/core" }
abl-lsp = { path = "crates/lsp" }
abl-oe = { path = "crates/oe" }
lsp-types = "0.94.1"
serde_json = "1"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
tower-lsp = "0.20"
walkdir = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
